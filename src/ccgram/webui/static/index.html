<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>Кара</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/vendor/hljs-light.min.css" id="hljs-light">
<link rel="stylesheet" href="/static/vendor/hljs-dark.min.css" id="hljs-dark" disabled>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <img class="login-logo" src="/static/icon.svg" alt="">
    <h1>Кара</h1>
    <p class="muted">Сессии Claude с N100 — те же, что в Telegram.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <button type="submit" class="btn primary">Войти</button>
    <div id="login-error" class="error"></div>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="side-head">
      <a class="brand" href="#new"><img src="/static/icon.svg" alt=""><span>Кара</span></a>
      <button id="collapse-btn" class="icon-btn" title="Свернуть" aria-label="Свернуть панель">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <a id="new-btn" class="new-chat" href="#new"><span class="new-ico">+</span><span>Новый чат</span></a>
    <div class="search-wrap"><input id="filter" type="search" placeholder="Поиск по чатам" autocomplete="off"></div>
    <nav id="session-list" class="session-list"></nav>
    <div class="side-foot">
      <button id="profile-btn" class="profile">
        <span class="initials">А</span>
        <span class="who"><b>Александр</b><span class="muted" id="conn-text">на связи</span></span>
        <span id="conn" class="conn"></span>
      </button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn show-collapsed" aria-label="Чаты">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <a class="icon-btn show-collapsed" href="#new" title="Новый чат" aria-label="Новый чат">+</a>
      <button id="title-btn" class="title-btn" hidden>
        <span id="chat-name">Кара</span>
        <span id="chat-badge" class="badge" hidden>веб</span>
        <svg class="chev-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="spacer"></span>
      <span id="chat-state" class="chat-state"></span>
      <button id="pane-btn" class="icon-btn" title="Терминал" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
      </button>
    </header>

    <section id="pane" class="pane" hidden>
      <pre id="pane-text"></pre>
      <div class="keys" data-keys></div>
    </section>

    <section id="scroller" class="scroller">
      <div id="thread" class="thread"></div>
      <div id="home" class="home" hidden>
        <div class="greet"><img src="/static/icon.svg" alt=""><h1 id="greet-text">Добрый вечер, Александр</h1></div>
      </div>
    </section>
    <button id="jump-btn" class="jump-btn" hidden aria-label="Вниз">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>

    <footer id="dock" class="dock">
      <div id="prompt-card" class="prompt-card" hidden>
        <div class="prompt-head"><span class="pulse"></span><b id="prompt-title">Кара ждёт ответа</b></div>
        <pre id="prompt-text"></pre>
        <div class="keys" data-keys></div>
      </div>
      <div id="working" class="working" hidden>
        <span class="spark"></span><span id="working-text">Кара работает…</span>
        <button id="stop-btn" class="btn small">Стоп</button>
      </div>
      <form id="composer" class="composer">
        <div id="attachments" class="attachments"></div>
        <textarea id="input" rows="1" placeholder="Как я могу помочь?"></textarea>
        <div class="composer-bar">
          <label class="tool-btn" title="Прикрепить файлы">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            <input id="file-input" type="file" multiple hidden>
          </label>
          <button id="tg-toggle" type="button" class="tool-btn chip" title="Дублировать в Telegram" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.6l-3.1 14.7c-.2 1-.8 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.7-7.9c.4-.3-.1-.5-.6-.2L6.8 13.2 2.2 11.7c-1-.3-1-1 .2-1.5l18-6.9c.8-.3 1.6.2 1.5 1.3z"/></svg>
            <span id="tg-toggle-text">Telegram</span>
          </button>
          <span class="spacer"></span>
          <button id="model-btn" type="button" class="model-btn" hidden><span id="model-name">Модель</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button id="send-btn" type="submit" class="send-btn" disabled aria-label="Отправить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
      <div id="disclaimer" class="disclaimer muted"></div>
    </footer>
  </main>
</div>

<div id="menu" class="menu" hidden></div>
<dialog id="confirm" class="dialog">
  <form method="dialog">
    <h3 id="confirm-title"></h3>
    <p id="confirm-text" class="muted"></p>
    <div class="dialog-actions">
      <button value="cancel" class="btn">Отмена</button>
      <button value="ok" id="confirm-ok" class="btn danger-fill">Удалить</button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" hidden></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
